<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materi Pak Haqi</title>
<style>
  :root {
    --bg:#eef2f6; --panel:#fff; --ink:#14233a; --muted:#5d6c82; --line:#d5dde8;
    --accent:#0b6bcb; --accent-soft:#e4f0fc;
    --ppt:#d2561f; --pdf:#c42b3a; --doc:#1f5fbf; --xls:#1d8a4f; --zip:#7a5a14; --pkt:#0b7f8c; --other:#5d6c82;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1724; --panel:#162234; --ink:#e6edf6; --muted:#93a3ba; --line:#263650; --accent:#5aa9f5; --accent-soft:#1b3350; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:56px 20px 80px; }
  header { margin-bottom:28px; }
  .kampus { color:var(--muted); font-size:.95rem; margin:0 0 6px; }
  h1 { font-size:clamp(1.9rem,5vw,2.8rem); line-height:1.1; margin:0 0 18px; letter-spacing:-.02em; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .search { flex:1 1 240px; padding:12px 16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); font:inherit; }
  .search:focus-visible, .row:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .jumlah { color:var(--muted); font-size:.92rem; }
  .rack { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .row { display:grid; grid-template-columns:56px 1fr auto; gap:16px; align-items:center; padding:14px 18px;
         color:inherit; text-decoration:none; border-top:1px solid var(--line); position:relative; }
  .row:first-child { border-top:0; }
  .row::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c,var(--other)); }
  .row:hover { background:var(--accent-soft); }
  .badge { width:48px; height:48px; border-radius:8px; background:var(--c,var(--other)); color:#fff; display:grid; place-items:center; font-weight:700; font-size:.78rem; }
  .nama { font-weight:600; overflow-wrap:anywhere; display:block; }
  .meta { color:var(--muted); font-size:.88rem; }
  .unduh { font-size:.9rem; font-weight:600; color:var(--accent); border:1px solid var(--accent); padding:7px 14px; border-radius:999px; white-space:nowrap; }
  .row:hover .unduh { background:var(--accent); color:#fff; }
  .ppt{--c:var(--ppt)} .pdf{--c:var(--pdf)} .doc{--c:var(--doc)} .xls{--c:var(--xls)} .zip{--c:var(--zip)} .pkt{--c:var(--pkt)}
  .crumb { margin:14px 0 0; font-size:.95rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px; }
  .crumb a { color:var(--accent); text-decoration:none; font-weight:600; }
  .crumb a:hover { text-decoration:underline; }
  .dir { --c:var(--accent); }
  .dir .badge { background:var(--accent-soft); color:var(--accent); border:2px solid var(--accent); }
  .pesan { padding:40px 20px; text-align:center; color:var(--muted); }
  footer { margin-top:22px; color:var(--muted); font-size:.88rem; }
  @media (max-width:520px) {
    .row { grid-template-columns:48px 1fr; }
    .unduh { grid-column:2; justify-self:start; }
    .badge { width:42px; height:42px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kampus" id="subjudul"></p>
    <h1 id="judul"></h1>
    <div class="bar">
      <input class="search" id="cari" type="search" placeholder="Cari materi, misalnya Module 10" aria-label="Cari materi" autocomplete="off">
      <span class="jumlah" id="jumlah"></span>
    </div>
    <nav class="crumb" id="crumb" aria-label="Lokasi folder"></nav>
  </header>
  <main class="rack" id="rack"><div class="pesan">Memuat daftar materi...</div></main>
  <footer>Lecturer: Muhammad Abdul Haq, S.Tr.T, M.Eng., Ph.D</P></footer>
</div>

<script>
// ===== PENGATURAN =====
const JUDUL    = 'Materi Kuliah';
const SUBJUDUL = 'Universitas Muhammadiyah Yogyakarta';
const OWNER  = 'muhabdulhaq';
const REPO   = 'muhabdulhaq.github.io';
const FOLDER = 'lecture';   // kosong = otomatis sesuai lokasi halaman ini
const ABAIKAN = ['index.html', 'README.md', 'LICENSE', 'CNAME', '.gitignore', '.nojekyll'];
const ABAIKAN_FOLDER = ['assets', 'node_modules'];
// ======================

document.getElementById('judul').textContent = JUDUL;
document.getElementById('subjudul').textContent = SUBJUDUL;
document.title = JUDUL;

const rack = document.getElementById('rack'), jumlah = document.getElementById('jumlah'),
      cari = document.getElementById('cari'), crumb = document.getElementById('crumb');
const kelas = {pptx:'ppt',ppt:'ppt',pdf:'pdf',docx:'doc',doc:'doc',xlsx:'xls',xls:'xls',zip:'zip',rar:'zip',pkt:'pkt',pka:'pkt'};
const cache = {};

// Folder tempat halaman ini berada di dalam repo
function folderDasar() {
  if (FOLDER) return FOLDER.replace(/^\/|\/$/g, '');
  let seg = location.pathname.split('/').filter(Boolean);
  if (seg.length && seg[seg.length - 1].includes('.')) seg.pop();
  if (seg[0] === REPO) seg = seg.slice(1);
  return seg.map(decodeURIComponent).join('/');
}
const DASAR = folderDasar();
const PREFIX = FOLDER ? DASAR + '/' : '';

const enc = p => p.split('/').map(encodeURIComponent).join('/');
const sub = () => decodeURIComponent(location.hash.slice(1)).replace(/^\/|\/$/g, '');

function ukuran(b) {
  const u = ['B','KB','MB','GB']; let i = 0;
  while (b >= 1024 && i < 3) { b /= 1024; i++; }
  return (i ? b.toFixed(1) : b) + ' ' + u[i];
}
function pesan(teks) { rack.innerHTML = ''; const d = document.createElement('div'); d.className = 'pesan'; d.textContent = teks; rack.appendChild(d); }

async function ambil(path) {
  const lengkap = [DASAR, path].filter(Boolean).join('/');
  if (cache[lengkap]) return cache[lengkap];
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${enc(lengkap)}`);
  if (res.status === 403) throw new Error('Batas permintaan GitHub tercapai. Coba lagi beberapa menit lagi.');
  if (!res.ok) throw new Error(`Folder "${lengkap || '(utama)'}" di ${OWNER}/${REPO} tidak bisa dibuka (kode ${res.status}). Pastikan repository publik.`);
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error('Alamat ini bukan folder.');
  return (cache[lengkap] = data);
}

function tampilkanCrumb(path) {
  crumb.innerHTML = '';
  const root = document.createElement('a'); root.href = '#'; root.textContent = 'Semua matkul';
  crumb.appendChild(root);
  let acc = '';
  path.split('/').filter(Boolean).forEach(p => {
    acc += (acc ? '/' : '') + p;
    crumb.appendChild(document.createTextNode('/'));
    const a = document.createElement('a'); a.href = '#' + enc(acc); a.textContent = p; crumb.appendChild(a);
  });
}

function baris(tipe, nama, path, ukur) {
  const ext = tipe === 'dir' ? '' : (nama.split('.').pop() || '').toLowerCase();
  const a = document.createElement('a');
  a.className = 'row ' + (tipe === 'dir' ? 'dir' : (kelas[ext] || ''));
  if (tipe === 'dir') a.href = '#' + enc(path);
  else { a.href = PREFIX + enc(path); a.setAttribute('download', ''); }
  a.dataset.nama = nama.toLowerCase();
  a.innerHTML = '<span class="badge"></span><span><span class="nama"></span><span class="meta"></span></span><span class="unduh"></span>';
  a.querySelector('.badge').textContent = tipe === 'dir' ? 'DIR' : (ext.toUpperCase() || 'FILE');
  a.querySelector('.nama').textContent = nama;
  a.querySelector('.meta').textContent = tipe === 'dir' ? 'Folder' : ukuran(ukur);
  a.querySelector('.unduh').textContent = tipe === 'dir' ? 'Buka' : 'Unduh';
  return a;
}

async function render() {
  const path = sub();
  cari.value = '';
  tampilkanCrumb(path);
  pesan('Memuat daftar materi...');
  try {
    const data = await ambil(path);
    const abc = (x, y) => x.name.localeCompare(y.name, undefined, { numeric: true, sensitivity: 'base' });
    const dirs  = data.filter(f => f.type === 'dir' && f.name[0] !== '.' && !ABAIKAN_FOLDER.includes(f.name)).sort(abc);
    const files = data.filter(f => f.type === 'file' && f.name[0] !== '.' && !ABAIKAN.includes(f.name)).sort(abc);
    rack.innerHTML = '';
    if (!dirs.length && !files.length) return pesan('Folder ini masih kosong.');
    dirs.forEach(d => rack.appendChild(baris('dir', d.name, [path, d.name].filter(Boolean).join('/'))));
    files.forEach(f => rack.appendChild(baris('file', f.name, [path, f.name].filter(Boolean).join('/'), f.size)));
    const nihil = document.createElement('div');
    nihil.className = 'pesan'; nihil.hidden = true; nihil.textContent = 'Tidak ada yang cocok dengan pencarian.';
    rack.appendChild(nihil);
    const total = dirs.length + files.length;
    jumlah.textContent = total + ' item';
    cari.oninput = () => {
      const q = cari.value.trim().toLowerCase(); let n = 0;
      rack.querySelectorAll('.row').forEach(r => { const ok = r.dataset.nama.includes(q); r.hidden = !ok; if (ok) n++; });
      jumlah.textContent = n + ' item'; nihil.hidden = n !== 0;
    };
  } catch (e) { jumlah.textContent = ''; pesan(e.message); }
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>

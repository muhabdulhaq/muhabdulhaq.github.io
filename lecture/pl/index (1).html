<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materi WAN & Teknologi Jaringan</title>
<style>
  :root {
    --bg:#eef2f6; --panel:#fff; --ink:#14233a; --muted:#5d6c82; --line:#d5dde8;
    --accent:#0b6bcb; --accent-soft:#e4f0fc;
    --ppt:#d2561f; --pdf:#c42b3a; --doc:#1f5fbf; --xls:#1d8a4f; --zip:#7a5a14; --pkt:#0b7f8c; --other:#5d6c82;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1724; --panel:#162234; --ink:#e6edf6; --muted:#93a3ba; --line:#263650; --accent:#5aa9f5; --accent-soft:#1b3350; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:56px 20px 80px; }
  header { margin-bottom:28px; }
  .kampus { color:var(--muted); font-size:.95rem; margin:0 0 6px; }
  h1 { font-size:clamp(1.9rem,5vw,2.8rem); line-height:1.1; margin:0 0 18px; letter-spacing:-.02em; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .search { flex:1 1 240px; padding:12px 16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); font:inherit; }
  .search:focus-visible, .row:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .jumlah { color:var(--muted); font-size:.92rem; }
  .rack { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .row { display:grid; grid-template-columns:56px 1fr auto; gap:16px; align-items:center; padding:14px 18px;
         color:inherit; text-decoration:none; border-top:1px solid var(--line); position:relative; }
  .row:first-child { border-top:0; }
  .row::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c,var(--other)); }
  .row:hover { background:var(--accent-soft); }
  .badge { width:48px; height:48px; border-radius:8px; background:var(--c,var(--other)); color:#fff; display:grid; place-items:center; font-weight:700; font-size:.78rem; }
  .nama { font-weight:600; overflow-wrap:anywhere; display:block; }
  .meta { color:var(--muted); font-size:.88rem; }
  .unduh { font-size:.9rem; font-weight:600; color:var(--accent); border:1px solid var(--accent); padding:7px 14px; border-radius:999px; white-space:nowrap; }
  .row:hover .unduh { background:var(--accent); color:#fff; }
  .ppt{--c:var(--ppt)} .pdf{--c:var(--pdf)} .doc{--c:var(--doc)} .xls{--c:var(--xls)} .zip{--c:var(--zip)} .pkt{--c:var(--pkt)}
  .pesan { padding:40px 20px; text-align:center; color:var(--muted); }
  footer { margin-top:22px; color:var(--muted); font-size:.88rem; }
  @media (max-width:520px) {
    .row { grid-template-columns:48px 1fr; }
    .unduh { grid-column:2; justify-self:start; }
    .badge { width:42px; height:42px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kampus" id="subjudul"></p>
    <h1 id="judul"></h1>
    <div class="bar">
      <input class="search" id="cari" type="search" placeholder="Cari materi, misalnya Module 10" aria-label="Cari materi" autocomplete="off">
      <span class="jumlah" id="jumlah"></span>
    </div>
  </header>
  <main class="rack" id="rack"><div class="pesan">Memuat daftar materi...</div></main>
  <footer>Daftar ini diambil otomatis dari isi repository GitHub.</footer>
</div>

<script>
// ===== PENGATURAN =====
const JUDUL    = 'Materi WAN & Teknologi Jaringan';
const SUBJUDUL = 'Universitas Muhammadiyah Yogyakarta';
// Biarkan kosong agar terdeteksi otomatis dari alamat situs (username.github.io/nama-repo).
// Isi manual hanya jika memakai domain sendiri atau mau memakai subfolder.
const OWNER  = '';   // contoh: 'budi123'
const REPO   = '';   // contoh: 'materi-wan'
const FOLDER = '';   // contoh: 'modul' (kosong = folder utama repo)
const ABAIKAN = ['index.html', 'README.md', 'LICENSE', 'CNAME', '.gitignore', '.nojekyll'];
// ======================

document.getElementById('judul').textContent = JUDUL;
document.getElementById('subjudul').textContent = SUBJUDUL;
document.title = JUDUL;

const rack = document.getElementById('rack'), jumlah = document.getElementById('jumlah'), cari = document.getElementById('cari');
const kelas = {pptx:'ppt',ppt:'ppt',pdf:'pdf',docx:'doc',doc:'doc',xlsx:'xls',xls:'xls',zip:'zip',rar:'zip',pkt:'pkt',pka:'pkt'};

function ukuran(b) {
  const u = ['B','KB','MB','GB']; let i = 0;
  while (b >= 1024 && i < 3) { b /= 1024; i++; }
  return (i ? b.toFixed(1) : b) + ' ' + u[i];
}

function pesan(teks) { rack.innerHTML = ''; const d = document.createElement('div'); d.className = 'pesan'; d.textContent = teks; rack.appendChild(d); }

let PREFIX = '';

function kandidat() {
  const host = location.hostname;
  const owner = OWNER || (host.endsWith('.github.io') ? host.split('.')[0] : '');
  let seg = location.pathname.split('/').filter(Boolean);
  if (seg.length && seg[seg.length - 1].includes('.')) seg.pop();   // buang nama file, mis. index.html
  const out = [];
  if (REPO) out.push({ owner, repo: REPO, folder: FOLDER });
  else {
    if (seg.length) out.push({ owner, repo: seg[0], folder: FOLDER || seg.slice(1).join('/') });
    out.push({ owner, repo: owner + '.github.io', folder: FOLDER || seg.join('/') });
  }
  return out.filter(k => k.owner);
}

async function muat() {
  const daftar = kandidat();
  if (!daftar.length) return pesan('Repository tidak terdeteksi. Isi OWNER dan REPO di bagian pengaturan index.html.');
  const dicoba = [];
  for (const k of daftar) {
    const url = `https://api.github.com/repos/${k.owner}/${k.repo}/contents/${k.folder}`;
    try {
      const res = await fetch(url);
      if (res.status === 403) return pesan('Batas permintaan GitHub tercapai. Coba lagi beberapa menit lagi.');
      if (!res.ok) { dicoba.push(`${k.owner}/${k.repo}/${k.folder} (${res.status})`); continue; }
      const data = await res.json();
      if (!Array.isArray(data)) { dicoba.push(`${k.owner}/${k.repo}/${k.folder} (bukan folder)`); continue; }
      PREFIX = FOLDER ? FOLDER.replace(/\/$/, '') + '/' : '';
      const files = data
        .filter(f => f.type === 'file' && f.name[0] !== '.' && !ABAIKAN.includes(f.name))
        .sort((x, y) => x.name.localeCompare(y.name, undefined, { numeric: true, sensitivity: 'base' }));
      if (!files.length) return pesan(`Tidak ada file di ${k.owner}/${k.repo}/${k.folder}. Jika file ada di folder lain, isi FOLDER di pengaturan.`);
      return tampil(files);
    } catch (e) { dicoba.push(`${k.owner}/${k.repo} (${e.message})`); }
  }
  pesan('Daftar gagal dimuat. Sudah dicoba: ' + dicoba.join(', ') + '. Pastikan repository publik, lalu isi OWNER, REPO, dan FOLDER di pengaturan.');
}

function tampil(files) {
  rack.innerHTML = '';
  if (!files.length) return pesan('Belum ada file. Upload file ke repository dan akan muncul di sini.');
  for (const f of files) {
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const a = document.createElement('a');
    a.className = 'row ' + (kelas[ext] || '');
    a.href = PREFIX + encodeURIComponent(f.name);
    a.setAttribute('download', '');
    a.dataset.nama = f.name.toLowerCase();
    a.innerHTML = '<span class="badge"></span><span><span class="nama"></span><span class="meta"></span></span><span class="unduh">Unduh</span>';
    a.querySelector('.badge').textContent = ext.toUpperCase() || 'FILE';
    a.querySelector('.nama').textContent = f.name;
    a.querySelector('.meta').textContent = ukuran(f.size);
    rack.appendChild(a);
  }
  const nihil = document.createElement('div');
  nihil.className = 'pesan'; nihil.hidden = true; nihil.textContent = 'Tidak ada materi yang cocok dengan pencarian.';
  rack.appendChild(nihil);
  jumlah.textContent = files.length + ' file';
  cari.oninput = () => {
    const q = cari.value.trim().toLowerCase(); let n = 0;
    rack.querySelectorAll('.row').forEach(r => { const ok = r.dataset.nama.includes(q); r.hidden = !ok; if (ok) n++; });
    jumlah.textContent = n + ' file'; nihil.hidden = n !== 0;
  };
}
muat();
</script>
</body>
</html>
